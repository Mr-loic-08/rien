<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
#itech-startup{position:fixed;inset:0;z-index:2147483600;background:linear-gradient(115deg,#071a31d9,#0d2b4aa6),url('/images/errors/loading.webp') center/cover no-repeat;display:grid;place-items:center;color:white;font-family:Arial,sans-serif;text-align:center;padding:20px}
#itech-startup .ring{width:95px;height:95px;border:6px solid #286094;border-top-color:#f26a21;border-right-color:#f26a21;border-radius:50%;margin:0 auto 26px;animation:itechspin 1.1s linear infinite}
#itech-startup h1{font-size:clamp(22px,4vw,32px);margin:0 0 12px}#itech-startup p{color:#e6f0ff;font-size:15px}#itech-startup a{display:inline-block;background:#f26a21;color:#fff;padding:12px 24px;border-radius:12px;margin-top:15px;text-decoration:none}
@keyframes itechspin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#itech-startup .ring{animation:none}}
</style></head>
<body><div id="itech-startup" role="status" aria-live="polite"><div><div class="ring" aria-hidden="true"></div><h1 id="itech-startup-title">Chargement <span style="color:#f26a21">en cours...</span></h1><p id="itech-startup-description">Veuillez patienter, nous préparons votre page.</p><a id="itech-startup-retry" href="" hidden>Réessayer</a></div></div>
