<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I-TECH — Transformation digitale financière</title>
    <link rel="icon" type="image/png" href="/images/i-tech-logo.png" />
    <link rel="apple-touch-icon" href="/images/i-tech-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Static declarations for Netlify Forms detection at deploy time -->
    <form name="demo-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field"><input name="nom"><input name="prenom"><input name="org">
      <input name="fonction"><input name="email"><input name="tel"><input name="pays">
      <input name="secteur"><input name="secteurAutre"><input name="solutions">
      <textarea name="message"></textarea><input name="privacy">
    </form>
    <form name="quick-response" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field"><input name="name"><input name="email">
      <input name="phone"><textarea name="message"></textarea><input name="source">
    </form>

    <!-- Netlify détecte ce formulaire statique au build. Le formulaire React envoie vers le même nom. -->
    <form name="quick-response" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quick-response" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <textarea name="message"></textarea>
      <input name="source" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
